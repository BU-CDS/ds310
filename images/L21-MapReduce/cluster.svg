<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img"
     aria-label="A cluster of three machines. Each machine has a CPU and a locally attached disk, and all three are connected by a high-bandwidth interconnect.">
  <defs>
    <linearGradient id="fabric" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="800">
      <stop offset="0" stop-color="#1f618a"/>
      <stop offset="0.55" stop-color="#174866"/>
      <stop offset="1" stop-color="#102838"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e4ebf2"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31485c"/>
      <stop offset="1" stop-color="#1a2c3b"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6aab"/>
      <stop offset="1" stop-color="#163e6b"/>
    </linearGradient>
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="0.18" stop-color="#d5e1ea"/>
      <stop offset="0.55" stop-color="#b7c8d4"/>
      <stop offset="0.82" stop-color="#8ea4b4"/>
      <stop offset="1" stop-color="#c5d4de"/>
    </linearGradient>
    <linearGradient id="cylTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4e2ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a3044" flood-opacity="0.18"/>
    </filter>
    <style>
      text {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
    </style>
    <symbol id="node" viewBox="0 0 612 240" overflow="visible">
      <rect x="-8" y="104" width="20" height="32" rx="4" fill="#143044"/>
      <g>
        <rect width="612" height="240" rx="18" fill="url(#chassis)"/>
        <path d="M18 0 H594 Q612 0 612 18 V48 H0 V18 Q0 0 18 0 Z" fill="url(#bezel)"/>
        <text x="22" y="25" fill="#ffffff" font-size="28" font-weight="600" dominant-baseline="middle">machine</text>
        <line x1="306" y1="64" x2="306" y2="208" stroke="#d3dde6" stroke-width="1.5"/>
        <g fill="#e6c98a" stroke="#c4a15a" stroke-width="0.6">
          <rect x="116" y="60" width="8" height="12"/>
          <rect x="136" y="60" width="8" height="12"/>
          <rect x="156" y="60" width="8" height="12"/>
          <rect x="176" y="60" width="8" height="12"/>
          <rect x="196" y="60" width="8" height="12"/>
          <rect x="116" y="176" width="8" height="12"/>
          <rect x="136" y="176" width="8" height="12"/>
          <rect x="156" y="176" width="8" height="12"/>
          <rect x="176" y="176" width="8" height="12"/>
          <rect x="196" y="176" width="8" height="12"/>
          <rect x="90" y="86" width="12" height="8"/>
          <rect x="90" y="106" width="12" height="8"/>
          <rect x="90" y="126" width="12" height="8"/>
          <rect x="90" y="146" width="12" height="8"/>
          <rect x="90" y="166" width="12" height="8"/>
          <rect x="214" y="86" width="12" height="8"/>
          <rect x="214" y="106" width="12" height="8"/>
          <rect x="214" y="126" width="12" height="8"/>
          <rect x="214" y="146" width="12" height="8"/>
          <rect x="214" y="166" width="12" height="8"/>
        </g>
        <rect x="100" y="70" width="116" height="108" rx="8" fill="url(#chip)"/>
        <circle cx="112" cy="82" r="4" fill="#e6c98a"/>
        <rect x="124" y="90" width="68" height="68" rx="5" fill="#0c2744"/>
        <g fill="#3d92f0">
          <rect x="132" y="98" width="22" height="22" rx="2"/>
          <rect x="162" y="98" width="22" height="22" rx="2"/>
          <rect x="132" y="128" width="22" height="22" rx="2"/>
          <rect x="162" y="128" width="22" height="22" rx="2"/>
        </g>
        <text x="158" y="214" text-anchor="middle" fill="#1c3144" font-size="30" font-weight="600">CPU</text>
        <!-- cylinder: bottom rim, body, then the top face -->
        <ellipse cx="456" cy="164" rx="72" ry="20" fill="url(#cylBody)"/>
        <rect x="384" y="92" width="144" height="72" fill="url(#cylBody)"/>
        <line x1="384" y1="92" x2="384" y2="164" stroke="#6e8798" stroke-width="1.5"/>
        <line x1="528" y1="92" x2="528" y2="164" stroke="#6e8798" stroke-width="1.5"/>
        <path d="M384 164 A72 20 0 0 0 528 164" fill="none" stroke="#6e8798" stroke-width="1.5"/>
        <ellipse cx="456" cy="92" rx="72" ry="20" fill="url(#cylTop)" stroke="#6e8798" stroke-width="1.5"/>
        <ellipse cx="430" cy="86" rx="26" ry="8" fill="#ffffff" opacity="0.55"/>
        <text x="456" y="214" text-anchor="middle" fill="#1c3144" font-size="30" font-weight="600">local disk</text>
      </g>
    </symbol>
  </defs>

  <text x="34" y="390" fill="#16324a" font-size="40" font-weight="600"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(-90 34 390)">high-bandwidth interconnect</text>

  <rect x="84" y="12" width="26" height="756" rx="13" fill="url(#fabric)"/>
  <rect x="93" y="28" width="8" height="724" rx="4" fill="#7eebf5" opacity="0.9"/>

  <g stroke-linecap="round" fill="none">
    <path d="M110 132 H152" stroke="#49d6ea" stroke-width="18" opacity="0.18"/>
    <path d="M110 132 H152" stroke="#123044" stroke-width="12"/>
    <path d="M110 132 H152" stroke="#49d6ea" stroke-width="5"/>
    <path d="M110 132 H152" stroke="#e7fdff" stroke-width="1.6" opacity="0.85"/>
    <path d="M110 390 H152" stroke="#49d6ea" stroke-width="18" opacity="0.18"/>
    <path d="M110 390 H152" stroke="#123044" stroke-width="12"/>
    <path d="M110 390 H152" stroke="#49d6ea" stroke-width="5"/>
    <path d="M110 390 H152" stroke="#e7fdff" stroke-width="1.6" opacity="0.85"/>
    <path d="M110 648 H152" stroke="#49d6ea" stroke-width="18" opacity="0.18"/>
    <path d="M110 648 H152" stroke="#123044" stroke-width="12"/>
    <path d="M110 648 H152" stroke="#49d6ea" stroke-width="5"/>
    <path d="M110 648 H152" stroke="#e7fdff" stroke-width="1.6" opacity="0.85"/>
  </g>
  <g fill="#49d6ea">
    <circle cx="110" cy="132" r="7"/>
    <circle cx="110" cy="390" r="7"/>
    <circle cx="110" cy="648" r="7"/>
  </g>

  <g filter="url(#shadow)">
    <use href="#node" x="160" y="12" width="612" height="240"/>
    <use href="#node" x="160" y="270" width="612" height="240"/>
    <use href="#node" x="160" y="528" width="612" height="240"/>
  </g>
  <g fill="#d7f4fb" font-size="28" font-weight="700" dominant-baseline="middle">
    <text x="308" y="37">1</text>
    <text x="308" y="295">2</text>
    <text x="308" y="553">3</text>
  </g>
</svg>
