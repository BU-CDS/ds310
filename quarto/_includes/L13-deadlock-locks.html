  Companion diagram for the Deadlock slide in L13-Locking2.qmd.
  Same visual language as the other lock figures: a padlock on each database
  element, T1 in blue, T2 in orange. Each state matches one frame of the
  schedule (deadlock-1.png through deadlock-6.png):

    start   T2 holds an exclusive lock on A; B is unlocked
    step 1  T1 holds a shared lock on B
    step 2  T2 requests an exclusive lock on B
    step 3  that request waits, because T1 holds B
    step 4  T1 requests a shared lock on A, while T2 is still waiting
    step 5  that request waits too: each holds one lock and waits for the other

  Fragment indices match the schedule images. fade-out is shown until its
  step; fade-in-then-out only during its step; the last state stays.
