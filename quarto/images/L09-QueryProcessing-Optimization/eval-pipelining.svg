<text x="300" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1a8a1a" text-anchor="start" font-weight="normal" font-style="normal">tuples</text>
<rect x="640.28" y="206.0" width="299.44" height="68" rx="8" fill="#fff" stroke="#3a5fcd" stroke-width="2" opacity="1"/>
<text x="790" y="232.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#3a5fcd" text-anchor="middle" font-weight="normal" font-style="normal">each operator is an iterator:</text>
<text x="790" y="258.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#3a5fcd" text-anchor="middle" font-weight="normal" font-style="normal">open( ) / next( ) / close( )</text>
<path d="M 660 265 Q 560 265 490 285" fill="none" stroke="#3a5fcd" stroke-width="2" stroke-dasharray="5,4"/>
<polygon points="490,285 502.4,288.2 498.8,275.7" fill="#3a5fcd"/>
<text x="790" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">π calls next( ) on ⋈,</text>
<text x="790" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">⋈ calls next( ) on its inputs, …</text>
<text x="790" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#555" text-anchor="middle" font-weight="normal" font-style="normal">demand-driven, one tuple at a time</text>
<text x="1060" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#3a5fcd" text-anchor="end" font-weight="bold" font-style="normal">no temp files — but blocking operators (sort, hash-join build) can't pipeline</text>
</svg>
