<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="660" viewBox="0 0 1150 660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1150" height="660" fill="#ffffff"/>
<text x="30" y="40" font-family="monospace" font-size="17" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">SELECT p.name, m.name FROM Person p JOIN Actor a ON p.id = a.actor_id</text>
<text x="30" y="62" font-family="monospace" font-size="17" fill="#000" text-anchor="start" font-weight="normal" font-style="normal">JOIN Movie m ON a.movie_id = m.id WHERE m.year = 2008</text>
<text x="400" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">π</text>
<text x="400" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">p.name, m.name</text>
<line x1="400" y1="142" x2="400" y2="180" stroke="#000" stroke-width="2"/>
<text x="400" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">⋈</text>
<text x="400" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">a.movie_id = m.id</text>
<line x1="386" y1="220" x2="290" y2="290" stroke="#000" stroke-width="2"/>
<line x1="414" y1="220" x2="585" y2="290" stroke="#000" stroke-width="2"/>
<text x="595" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1a8a1a" text-anchor="middle" font-weight="normal" font-style="italic">σ</text>
<text x="595" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a8a1a" text-anchor="middle" font-weight="normal" font-style="italic">year = 2008</text>
<line x1="595" y1="344" x2="595" y2="380" stroke="#000" stroke-width="2"/>
<text x="488" y="315" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a8a1a" text-anchor="end" font-weight="bold" font-style="normal">17 movies</text>
<text x="275" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">⋈</text>
<text x="275" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">p.id = a.actor_id</text>
<text x="182" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#3a5fcd" text-anchor="middle" font-weight="normal" font-style="italic">π</text>
<text x="182" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#3a5fcd" text-anchor="middle" font-weight="normal" font-style="italic">id, name</text>
<line x1="262" y1="330" x2="185" y2="362" stroke="#000" stroke-width="2"/>
<line x1="288" y1="330" x2="375" y2="385" stroke="#000" stroke-width="2"/>
<line x1="182" y1="405" x2="182" y2="438" stroke="#000" stroke-width="2"/>
<rect x="120.0" y="442.0" width="120" height="40" rx="8" fill="#cfe2f0" stroke="#000" stroke-width="2" opacity="1"/>
<text x="180" y="469" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#000" text-anchor="middle" font-weight="normal" font-style="normal">Person</text>
<text x="180" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#777" text-anchor="middle" font-weight="normal" font-style="normal">2,698 tuples</text>
<rect x="320.0" y="388.0" width="120" height="40" rx="8" fill="#cfe2f0" stroke="#000" stroke-width="2" opacity="1"/>
<text x="380" y="415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#000" text-anchor="middle" font-weight="normal" font-style="normal">Actor</text>
<text x="380" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#777" text-anchor="middle" font-weight="normal" font-style="normal">3,790 tuples</text>
<rect x="535.0" y="405.0" width="120" height="40" rx="8" fill="#cfe2f0" stroke="#000" stroke-width="2" opacity="1"/>
<text x="595" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#000" text-anchor="middle" font-weight="normal" font-style="normal">Movie</text>
<text x="595" y="465" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#777" text-anchor="middle" font-weight="normal" font-style="normal">755 tuples</text>
<text x="760" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#000" text-anchor="start" font-weight="bold" font-style="normal">step 2: push π down</text>
<text x="760" y="215" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">keep only the Person attributes still</text>
<text x="760" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#555" text-anchor="start" font-weight="normal" font-style="normal">needed:  id (to join)  and  name (output)</text>
<text x="760" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#3a5fcd" text-anchor="start" font-weight="normal" font-style="normal">narrower tuples → more per block</text>
<text x="760" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#3a5fcd" text-anchor="start" font-weight="normal" font-style="normal">→ fewer block transfers</text>
</svg>
