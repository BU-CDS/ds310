<polygon points="440,100 433.5,111.0 446.5,111.0" fill="#000"/>
<text x="490" y="115" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#000" text-anchor="start" font-weight="normal" font-style="italic">result</text>
<path d="M 30.0 307.6 A 55.0 17.6 0 0 1 140.0 307.6 L 140.0 392.4 A 55.0 17.6 0 0 1 30.0 392.4 Z" fill="#fde9d9" stroke="#000" stroke-width="2"/>
