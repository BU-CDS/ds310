<path d="M 480 285 Q 600 290 700 250" fill="none" stroke="#c00" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="700,250 687.4,248.1 692.2,260.1" fill="#c00"/>
<path d="M 730 155 Q 640 120 490 158" fill="none" stroke="#c00" stroke-width="2.5" stroke-dasharray="6,4"/>
<polygon points="490,158 502.3,161.6 499.1,149.0" fill="#c00"/>
<text x="905" y="315" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#c00" text-anchor="middle" font-weight="normal" font-style="normal">write the join result …</text>
<text x="680" y="95" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#c00" text-anchor="middle" font-weight="normal" font-style="normal">… then read it back for π</text>
<text x="880" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#3a5fcd" text-anchor="end" font-weight="bold" font-style="normal">every temp write + read  =  extra disk I/O</text>
</svg>
