<text x="85" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="normal" font-style="normal">temp T1</text>
<path d="M 230 415 Q 160 420 130 390" fill="none" stroke="#c00" stroke-width="2.5" stroke-dasharray="6,4"/>
