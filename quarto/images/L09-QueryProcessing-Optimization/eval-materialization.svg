<text x="620" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#000" text-anchor="middle" font-weight="normal" font-style="normal">Actor</text>
<text x="260" y="425" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">σ</text>
<text x="260" y="447" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">year = 2008</text>
<text x="440" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">⋈</text>
<text x="440" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">id = movie_id</text>
<text x="440" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">π</text>
<text x="440" y="187" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" font-style="italic">name, movie_id</text>
<line x1="260" y1="512" x2="260" y2="450" stroke="#000" stroke-width="2.5"/>
<line x1="275" y1="400" x2="425" y2="315" stroke="#000" stroke-width="2.5"/>
