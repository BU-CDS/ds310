<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
  <title>The concept of a lock</title>
  <desc>Each database element has its own lock. Element A is locked by transaction T1, which can
    therefore read and write A. Transaction T2 also wants A and must wait for the lock.
    Element B is unlocked.</desc>

  <!-- T1 blue and T2 orange, as in the animations (set-b and set-e in custom.scss) -->

  <!-- the database and its elements -->
  <rect x="400" y="10" width="300" height="390" rx="16" fill="#eeece6" stroke="#555" stroke-width="2.5"/>
  <text x="550" y="44" font-size="23" fill="#444">database elements</text>

  <!-- element A: locked by T1 -->
  <rect x="450" y="66" width="200" height="80" rx="8" fill="#fff" stroke="#555" stroke-width="2.5"/>
  <text x="505" y="119" font-size="36" font-weight="500">A</text>
  <path d="M582,101 V89 a13,13 0 0 1 26,0 V101" fill="none" stroke="#3a5fcd" stroke-width="6"/>
  <rect x="573" y="100" width="44" height="34" rx="6" fill="#3a5fcd"/>
  <circle cx="595" cy="113" r="4.5" fill="#fff"/>
  <rect x="593" y="113" width="4" height="12" rx="1.5" fill="#fff"/>
  <text x="550" y="174" font-size="21" font-style="italic" fill="#3a5fcd">locked by T<tspan dy="5" font-size="70%">1</tspan></text>

  <!-- element B: unlocked -->
  <rect x="450" y="236" width="200" height="80" rx="8" fill="#fff" stroke="#555" stroke-width="2.5"/>
  <text x="505" y="289" font-size="36" font-weight="500">B</text>
  <path d="M582,271 V249 a13,13 0 0 1 26,0 V258" fill="none" stroke="#999" stroke-width="6"/>
  <rect x="573" y="270" width="44" height="34" rx="6" fill="#999"/>
  <circle cx="595" cy="283" r="4.5" fill="#fff"/>
  <rect x="593" y="283" width="4" height="12" rx="1.5" fill="#fff"/>
  <text x="550" y="344" font-size="21" font-style="italic" fill="#777">unlocked</text>

  <!-- T1 holds A's lock, so it gets through -->
  <rect x="30" y="71" width="140" height="70" rx="14" fill="#3a5fcd" fill-opacity="0.1" stroke="#3a5fcd" stroke-width="3"/>
  <text x="100" y="118" font-size="34" font-weight="700" fill="#3a5fcd">T<tspan dy="8" font-size="70%">1</tspan></text>
  <path d="M172,106 H436" stroke="#3a5fcd" stroke-width="4"/>
  <path d="M450,106 l-17,-9 v18 z" fill="#3a5fcd"/>
  <text x="286" y="91" font-size="22" font-style="italic" fill="#3a5fcd">holds the lock on A</text>
  <text x="286" y="134" font-size="21" fill="#333">can read and write A</text>

  <!-- T2 wants A too, and is stopped at the lock -->
  <rect x="930" y="71" width="140" height="70" rx="14" fill="#cc6600" fill-opacity="0.1" stroke="#cc6600" stroke-width="3"/>
  <text x="1000" y="118" font-size="34" font-weight="700" fill="#cc6600">T<tspan dy="8" font-size="70%">2</tspan></text>
  <path d="M928,106 H700" stroke="#cc6600" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M684,106 l17,-9 v18 z" fill="#cc6600"/>
  <path d="M672,86 V126" stroke="#cc6600" stroke-width="7" stroke-linecap="round"/>
  <text x="815" y="91" font-size="22" font-style="italic" fill="#cc6600">also wants A</text>
  <text x="815" y="134" font-size="21" fill="#333">must wait for the lock</text>
</svg>
