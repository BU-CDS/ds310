    <text class="cell" x="367" y="531.0">2</text>
    <text class="cell" x="417" y="531.0">11</text>
    <text class="cell" x="137" y="555.0">2</text>
    <text class="cell" x="187" y="555.0">15:4:1999</text>
    <text class="cell" x="297" y="555.0">9:30</text>
    <text class="cell" x="367" y="555.0">2</text>
    <text class="cell" x="417" y="555.0">11</text>
    <text class="cell" x="137" y="579.0">3</text>
    <text class="cell" x="187" y="579.0">???</text>
    <text class="cell" x="367" y="579.0">3</text>
    <text class="cell" x="417" y="579.0">56</text>
    <text class="cell" x="137" y="603.0">4</text>
