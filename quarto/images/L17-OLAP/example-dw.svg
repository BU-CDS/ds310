        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        fill: #1c1c1c;
        dominant-baseline: middle;
      }
      .ptitle { font-size: 22px; font-weight: 600; fill: #7c1717; }
      .tname  { font-size: 18px; font-weight: 600; }
      .hdr    { font-size: 15px; font-weight: 600; }
      .cell   { font-size: 15px; }
      .note   { font-size: 17px; }
      .notehd { font-size: 17px; font-weight: 600; }
    </style>
  </defs>
  <!-- US operational database -->
