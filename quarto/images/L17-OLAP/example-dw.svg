    <text class="cell" x="357" y="213.0">21</text>
    <text class="cell" x="417" y="213.0">2</text>
    <text class="cell" x="307" y="237.0">2</text>
    <text class="cell" x="357" y="237.0">13</text>
    <text class="cell" x="417" y="237.0">1</text>
    <text class="cell" x="307" y="261.0">3</text>
