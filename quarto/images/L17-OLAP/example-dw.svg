<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 672" role="img"
     aria-label="Example of a data warehouse. Two operational databases (US and HK) feed a data warehouse that holds a FACT table and two dimension tables, time and product.">
  <defs>
